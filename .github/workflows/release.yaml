---
name: Build and release APK on tag
"on":
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Resolve changelog
        id: changelog
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::No changelog found at $CHANGELOG_FILE for versionCode $VERSION_CODE. Add one before tagging a release."
            exit 1
          fi
          echo "file=$CHANGELOG_FILE" >> "$GITHUB_OUTPUT"
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSPHRASE: ${{ secrets.KEYSTORE_PASSPHRASE }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSPHRASE"
            echo "KEY_ALIAS=signingkey"
            echo "KEY_PASSWORD=$KEYSTORE_PASSPHRASE"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        uses: ./.github/actions/gradle-task
        with:
          task: assembleRelease
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/materialistic-nouveau-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --notes-file "${{ steps.changelog.outputs.file }}" \
            --generate-notes \
            "app/build/outputs/apk/release/materialistic-nouveau-${{ github.ref_name }}.apk"
