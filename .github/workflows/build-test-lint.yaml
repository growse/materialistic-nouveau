---
name: "Subflow: Build, Test, and Lint"
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  ktfmt:
    name: ktfmt
    runs-on: ubuntu-latest
    steps:
      - name: "Validate input ref"
        if: ${{ inputs.ref == '' }}
        run: |
          echo "Input ref is empty. Please provide a valid ref."
          exit 1
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/gradle-task
        with:
          task: ktfmtCheck
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: "Validate input ref"
        if: ${{ inputs.ref == '' }}
        run: |
          echo "Input ref is empty. Please provide a valid ref."
          exit 1
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Build
        uses: ./.github/actions/gradle-task
        with:
          task: assembleDebug assembleAndroidTest
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      - name: Test
        uses: ./.github/actions/gradle-task
        with:
          task: app:createDebugUnitTestCoverageReport
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
      - name: JUnit Report Action
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/TEST-*.xml"
          detailed_summary: true
          include_passed: false # Lots of test, much output.
      - name: Report coverage
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: app/build/reports/coverage/test/debug/report.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit test coverage
          update-comment: true # One comment per PR, edited in place.
          # Overall sits near zero while the Java -> Kotlin migration is in flight,
          # so only newly touched lines are held to a bar.
          min-coverage-overall: 0
          min-coverage-changed-lines: 60
  instrumented-test:
    name: Instrumented test (${{ matrix.device }})
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        # Gradle Managed Devices defined in app/build.gradle.kts. aospApi23 is
        # left out: its emulator doesn't boot reliably on a fresh runner, and
        # GMD times out generating the snapshot.
        device: [atdApi33]
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
      # Hosted runners expose /dev/kvm but not to the runner user by default.
      # Without it the emulator falls back to software emulation and crawls.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented test
        uses: ./.github/actions/gradle-task
        with:
          # No GPU on the runner, so render in software.
          task: app:${{ matrix.device }}DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
      - name: JUnit Report Action
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: Instrumented test report (${{ matrix.device }})
          report_paths: "app/build/outputs/androidTest-results/managedDevice/**/TEST-*.xml"
          detailed_summary: true
          include_passed: false
      - name: Upload instrumented test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report-${{ matrix.device }}
          path: app/build/reports/androidTests/managedDevice/
  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build
        uses: ./.github/actions/gradle-task
        with:
          task: lint
          gradle-cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
      - name: Upload lint report
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
